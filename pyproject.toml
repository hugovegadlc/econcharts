[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econcharts"
version = "0.8.4"
description = "Publication-quality economic charts from minimal YAML specs (BBVA house style)."
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "pandas",
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "openpyxl",
    "python-pptx",
]

[project.optional-dependencies]
# Development + test + ship-build tools. Install with: pip install -e ".[dev]"
dev = ["pytest", "pytest-mpl", "pyinstaller"]

[project.scripts]
econcharts = "econcharts.cli:main"

[tool.setuptools.packages.find]
# NAME THE PACKAGE, do not glob for it. `econcharts*` also matched the sibling
# VBA project `econcharts_excel/` and walked into its .venv, so a built wheel
# carried a few thousand files from site-packages. Nothing shipped, because
# wheels are a non-goal here - but anyone who ever ran `pip install .` would
# have got it.
include = ["econcharts", "econcharts.*"]

# NOTE: themes/ and registry/ are data OUTSIDE the package (resolved via a path
# relative to econcharts/). An editable install (`pip install -e .`) and the frozen
# exe (PyInstaller --add-data, workstream D) both see them; a plain wheel would not.
# Wheel distribution isn't a target — the ship is a frozen exe.
